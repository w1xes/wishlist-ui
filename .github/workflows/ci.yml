name: UI CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  lint:
    name: UI lint
    runs-on: ubuntu-24.04
    steps:
      - &checkout
        uses: actions/checkout@v6
      - &node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - &install
        name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run lint

  types:
    name: UI typecheck
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - *node
      - *install
      - run: npm run typecheck

  build:
    name: UI build
    needs: types
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - *node
      - *install
      - run: npm run build
      - name: Upload production bundle
        uses: actions/upload-artifact@v6
        with:
          name: wishlist-ui-dist
          path: dist/
          if-no-files-found: error

  image:
    name: UI image
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - *checkout
      - name: Set up QEMU for arm64
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=auto
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_BASE=${{ vars.VITE_API_BASE || 'http://localhost:8000' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  image-scan:
    name: UI image scan
    continue-on-error: true
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - *checkout
      - uses: docker/setup-buildx-action@v4
      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: wishlist-ui:scan
          build-args: |
            VITE_API_BASE=${{ vars.VITE_API_BASE || 'http://localhost:8000' }}
          cache-from: type=gha
          provenance: false
          sbom: false
      - name: Scan, table report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: wishlist-ui:scan
          format: table
          output: trivy-report.txt
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
      - name: Scan, JSON report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: wishlist-ui:scan
          format: json
          output: trivy-report.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wishlist-ui-trivy-report
          path: |
            trivy-report.txt
            trivy-report.json
          if-no-files-found: warn
