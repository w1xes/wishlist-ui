name: wishlist-ui
services:
  ui:
    image: node:24-alpine
    working_dir: /workspace
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://127.0.0.1:8000}
    ports:
      - '127.0.0.1:${UI_PORT:-5174}:5174'
    command: sh -ec 'npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 5174 --strictPort'
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5174').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 60s
volumes:
  node_modules:
