server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Redirects for directory-like paths (for example /assets) must keep the host and port the
    # browser used, not the container port 80.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Single-page app: unknown paths fall back to index.html so a reload on any route works.
    # index.html must be revalidated on every load, otherwise browsers keep an old bundle name.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Vite puts a content hash in every file name under /assets/, so these files never change.
    # A missing asset must be a real 404, not index.html with status 200.
    location /assets/ {
        try_files $uri =404;
        # No "always": error responses (404) must not get the immutable cache header.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
